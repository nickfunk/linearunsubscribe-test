<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Linear</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Arial Narrow", Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 8px;
    }
    .logo-img {
      max-width: 180px;
      height: auto;
      margin-bottom: 0px;
      display: block;
    }
    .brand-title {
      font-size: 28px;
      letter-spacing: 6px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0 0 0px 0;
    }
    .action-link {
      color: #ffffff;
      text-decoration: underline;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 10px;
      transition: opacity 0.2s ease;
    }
    .action-link:hover {
      opacity: 0.7;
    }
    #status-message {
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-top: 10px;
    }
    footer {
      padding: 40px 20px;
    }
  </style>
</head>
<body>

  <!-- All content is now unified in the centered stack -->
  <div class="hero-container">
    
    <!-- 1. Your Custom Logo Graphic -->
    <img src="logo.png" alt="Linear Logo" class="logo-img">
    
    <!-- 2. Newsletter Link (Moved here, styled with a small margin below it) -->
    <button class="action-link" onclick="triggerDownload()" style="margin-bottom: 0px;">Current Newsletter</button>
    
    <!-- 3. Custom Substack Signup Form for LINEAR -->
    <div class="custom-substack-container">
      <form action="https://nickfunk.substack.com" method="post" target="_blank">
        <label for="substack-email">Prefer email updates?</label>
        <div class="form-row">
          <input type="email" name="email" id="substack-email" placeholder="Enter your email address" required />
          <button type="submit">Subscribe</button>
        </div>
      </form>
    </div>
    <!-- 4. Unsubscribe Interface Context -->
    <button id="unsub-btn" class="action-link" onclick="handleUnsubscribe()">Unsubscribe from text updates</button>
    <div id="status-message"></div>
    <style>
      .custom-substack-container {
        width: 100%;
        max-width: 420px;
        margin: 0px auto;
        font-family: "Arial Narrow", Arial, sans-serif;
        text-align: center;
      }
      .custom-substack-container label {
        display: block;
        margin-bottom: 4px;
        font-size: 14px;
        letter-spacing: 1px;
        color: #ffffff;
      }
      .form-row {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .custom-substack-container input[type="email"] {
        flex: 1;
        padding: 10px 12px;
        background-color: #000000;
        color: #ffffff;
        border: 1px solid #ffffff;
        border-radius: 0px;
        font-family: inherit;
        font-size: 14px;
        letter-spacing: 0.5px;
      }
      .custom-substack-container input[type="email"]::placeholder {
        color: #999999;
      }
      .custom-substack-container input[type="email"]:focus {
        outline: none;
        border-color: #cccccc;
      }
      .custom-substack-container button {
        padding: 10px 18px;
        background-color: #ffffff;
        color: #000000;
        border: 1px solid #ffffff;
        border-radius: 0px;
        font-family: inherit;
        font-size: 14px;
        font-weight: bold;
        letter-spacing: 1.5px;
        text-transform: uppercase;
        cursor: pointer;
        transition: opacity 0.2s ease;
      }
      .custom-substack-container button:hover {
        opacity: 0.7;
      }
    </style>
  </div>

  <script>
    const CONFIG = {
      webAppUrl: "https://script.google.com/macros/s/AKfycbxFVtXXxBLQD8wo4wGKe5BmqA7gIHfd6SFtAeYXUEqV4MjStGwosoPU5k-qR5QRkoXX/exec",
      // Constructed with safe format
      downloadUrl: "https://drive.google.com/uc?export=download&id=1PTpUZbZWug1Dp_-ML5L-YtPgLZ8WiW82"
    };
    // Subfolder-safe parameters engine
    function getClientId() {
      const urlParams = new URLSearchParams(window.location.search);
      return urlParams.get('id') || "Unknown";
    }

    // Direct real-time background tracking engine
    function logActionToBackend(actionType) {
      const clientId = getClientId();
      const targetUrl = CONFIG.webAppUrl + "?id=" + encodeURIComponent(clientId) + "&action=" + encodeURIComponent(actionType);
      
      // Fires quietly using no-cors mode to safely bypass domain restrictions
      fetch(targetUrl, { mode: 'no-cors' }).catch(() => {
        console.log("Tracking recorded.");
      });
    }

    // 1. VISIT TRACKING: Fires automatically on silent background page load
    logActionToBackend("visit");

    // 2. DOWNLOAD TRACKING: Logs the interaction first, then starts download thread
    function triggerDownload() {
      logActionToBackend("download");
      window.location.href = CONFIG.downloadUrl;
    }

    // 3. UNSUBSCRIBE EXECUTION: Logs the opt-out and cleanly updates the UI text in place
    function handleUnsubscribe() {
      const unsubBtn = document.getElementById('unsub-btn');
      const statusMsg = document.getElementById('status-message');

      unsubBtn.style.display = 'none';
      statusMsg.innerText = "Processing request...";

      // Fire tracking log directly to your script ledger
      logActionToBackend("unsubscribe");

      // Update the UI smoothly in place on your index.html page
      setTimeout(() => {
        statusMsg.innerText = "Request received.";
      }, 300);
    }
  </script>
</body>
</html>
