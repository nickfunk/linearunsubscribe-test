<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="robots" content="noindex">
  <title>Linear</title>
  <style>
    body {
      background-color: #000000;
      color: #ffffff;
      font-family: "Arial Narrow", Arial, sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .hero-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 20px;
      gap: 8px;
    }
    .logo-img {
      max-width: 180px;
      height: auto;
      margin-bottom: 0px;
      display: block;
    }
    .brand-title {
      font-size: 28px;
      letter-spacing: 6px;
      font-weight: bold;
      text-transform: uppercase;
      margin: 0 0 0px 0;
    }
    .action-link {
      color: #ffffff;
      text-decoration: underline;
      font-size: 14px;
      letter-spacing: 1px;
      cursor: pointer;
      background: none;
      border: none;
      font-family: inherit;
      padding: 10px;
      transition: opacity 0.2s ease;
    }
    .action-link:hover {
      opacity: 0.7;
    }
    #status-message {
      font-size: 14px;
      letter-spacing: 0.5px;
      color: #ffffff;
      margin-top: 10px;
    }
    .undo-link {
      color: #ffffff;
      text-decoration: underline;
      background: none;
      border: none;
      font-family: inherit;
      font-size: 14px;
      letter-spacing: 0.5px;
      cursor: pointer;
      padding: 0 0 0 6px;
      transition: opacity 0.2s ease;
    }
    .undo-link:hover {
      opacity: 0.7;
    }
    footer {
      padding: 40px 20px;
    }
    .custom-substack-container {
      width: 100%;
      max-width: 300px;
      margin: 12px auto;
      font-family: "Arial Narrow", Arial, sans-serif;
      text-align: center;
    }
    .subscribe-label {
      margin: 0 0 4px 0;
      font-size: 14px;
      letter-spacing: 1px;
      color: #ffffff;
    }
    .subscribe-btn {
      display: inline-block;
      width: 160px;
      box-sizing: border-box;
      padding: 12px 20px;
      background-color: #ffffff;
      color: #000000;
      border: 1px solid #ffffff;
      border-radius: 0px;
      font-family: inherit;
      font-size: 14px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      text-decoration: none;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .subscribe-btn:hover {
      opacity: 0.7;
    }
    /* Prominent view for direct email unsubscribe links */
    #email-unsub-view {
      display: none;
      max-width: 380px;
      margin-top: 16px;
    }
    .unsub-heading {
      font-size: 18px;
      letter-spacing: 3px;
      text-transform: uppercase;
      margin: 0 0 10px 0;
    }
    .unsub-subtext {
      font-size: 15px;
      letter-spacing: 0.5px;
      color: #cccccc;
      line-height: 1.5;
      margin: 0 0 24px 0;
    }
    .outline-btn {
      display: inline-block;
      padding: 10px 20px;
      background-color: transparent;
      color: #ffffff;
      border: 1px solid #ffffff;
      border-radius: 0px;
      font-family: inherit;
      font-size: 13px;
      font-weight: bold;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      transition: opacity 0.2s ease;
    }
    .outline-btn:hover {
      opacity: 0.7;
    }
  </style>
</head>
<body>
  <!-- All content is unified in the centered stack -->
  <div class="hero-container">
    <!-- 1. Custom Logo Graphic -->
    <img src="logo.png" alt="Linear Logo" class="logo-img">

    <!-- 2. Standard Homepage Content -->
    <div id="main-content" style="display: flex; flex-direction: column; align-items: center; gap: 8px; width: 100%;">
      <button class="action-link" onclick="triggerDownload()" style="margin-bottom: 0px;">Current Newsletter</button>

      <!-- Custom Substack link for LINEAR -->
      <div class="custom-substack-container">
        <p class="subscribe-label">Prefer email updates? Get notified through Substack when a fresh newsletter drops.</p>
        <a href="https://substack.com" target="_blank" rel="noopener noreferrer" class="subscribe-btn">
          Subscribe
        </a>
      </div>

      <!-- Text Unsubscribe Interface -->
      <button id="unsub-btn" class="action-link" onclick="handleTextUnsubscribe()">Unsubscribe from text updates</button>
      <div id="status-message"></div>
    </div>

    <!-- 3. Prominent Email Unsubscribe View (Hidden unless ?action=unsubscribe_email) -->
    <div id="email-unsub-view">
      <h2 id="email-unsub-heading" class="unsub-heading">Request Received</h2>
      <p id="email-unsub-subtext" class="unsub-subtext">You have been unsubscribed from future email updates.</p>
      <button id="email-undo-btn" class="outline-btn" onclick="handleEmailUndo()">Undo</button>
    </div>
  </div>

  <script>
    const CONFIG = {
      webAppUrl: "https://script.google.com/macros/s/AKfycbxFVtXXxBLQD8wo4wGKe5BmqA7gIHfd6SFtAeYXUEqV4MjStGwosoPU5k-qR5QRkoXX/exec",
      downloadUrl: "https://drive.google.com/file/d/1GC4X4XdO6bEHKz3rdgE377_xHC76Iwu2/view?usp=drive_link"
    };

    const urlParams = new URLSearchParams(window.location.search);

    function getClientId() {
      return urlParams.get('id') || "Unknown";
    }

    function logActionToBackend(actionType) {
      const clientId = getClientId();
      const targetUrl = CONFIG.webAppUrl + "?id=" + encodeURIComponent(clientId) + "&action=" + encodeURIComponent(actionType);

      fetch(targetUrl, { mode: 'no-cors' }).catch(() => {
        console.log("Tracking recorded.");
      });
    }

    // --- INITIALIZATION ON PAGE LOAD ---
    const initialAction = urlParams.get('action');

    if (initialAction === "unsubscribe_email") {
      // Show only logo + prominent confirmation screen
      document.getElementById('main-content').style.display = 'none';
      document.getElementById('email-unsub-view').style.display = 'block';

      if (getClientId() !== "Unknown") {
        logActionToBackend("unsubscribe_email");
      } else {
        document.getElementById('email-unsub-subtext').innerText = "Only valid via personal link.";
        document.getElementById('email-undo-btn').style.display = 'none';
      }
    } else {
      // Standard page visit
      logActionToBackend("visit");
    }

    // --- NEWSLETTER DOWNLOAD ---
    function triggerDownload() {
      logActionToBackend("download");
      window.location.href = CONFIG.downloadUrl;
    }

    // --- TEXT UNSUBSCRIBE + UNDO FLOW ---
    function handleTextUnsubscribe() {
      const statusMsg = document.getElementById('status-message');

      // Ignore unknown visitors without logging to sheet
      if (getClientId() === "Unknown") {
        statusMsg.innerText = "Only valid via personal link.";
        return;
      }

      const unsubBtn = document.getElementById('unsub-btn');
      unsubBtn.style.display = 'none';
      statusMsg.innerText = "Processing request...";

      logActionToBackend("unsubscribe");

      setTimeout(() => {
        statusMsg.innerHTML = 'Request received. <button class="undo-link" onclick="handleTextUndo()">Undo</button>';
      }, 300);
    }

    function handleTextUndo() {
      const unsubBtn = document.getElementById('unsub-btn');
      const statusMsg = document.getElementById('status-message');

      statusMsg.innerText = "Restoring preference...";
      logActionToBackend("resubscribe");

      setTimeout(() => {
        statusMsg.innerText = "Preference restored.";
        unsubBtn.style.display = 'inline-block';
      }, 300);
    }

    // --- EMAIL UNSUBSCRIBE UNDO FLOW ---
    let emailUnsubscribed = true;

    function handleEmailUndo() {
      const heading = document.getElementById('email-unsub-heading');
      const subtext = document.getElementById('email-unsub-subtext');
      const undoBtn = document.getElementById('email-undo-btn');

      if (emailUnsubscribed) {
        logActionToBackend("resubscribe_email");
        heading.innerText = "Preference Restored";
        subtext.innerText = "You remain subscribed to future email updates.";
        undoBtn.innerText = "Unsubscribe Again";
        emailUnsubscribed = false;
      } else {
        logActionToBackend("unsubscribe_email");
        heading.innerText = "Request Received";
        subtext.innerText = "You have been unsubscribed from future email updates.";
        undoBtn.innerText = "Undo";
        emailUnsubscribed = true;
      }
    }
  </script>
</body>
</html>
